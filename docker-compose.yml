services:
  rag_service:
    build:
      context: .
      dockerfile: rag_service/Dockerfile
    container_name: rag_service
    ports:
      - "8000:8000"
    env_file:
      - rag_service/.env
    environment:
      RAG_USE_RERANKER: "1"
      RAG_USE_EXPANDER: "1"
      RAG_TOP_K: "5"
      RAG_RERANK_POOL: "10"
      BM25_ALPHA: "0.5"
      RAG_SCORE_THRESHOLD: "0.78"  # conservative gate: below the weakest real short question (~0.79), only blatant off-topic is gated; prompt-refusal is the real backstop. See scripts/cosine_probe.py
      GIGACHAT_TIMEOUT: "20"
      GIGACHAT_MAX_RETRIES: "2"
      GIGACHAT_MAX_TOKENS: "1024"  # cap answer length; lower to save more output tokens
      HF_HOME: /root/.cache/huggingface
    volumes:
      - ./rag_service/data:/app/rag_service/data:ro
      - hf_cache:/root/.cache/huggingface
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request,sys; r=urllib.request.urlopen('http://localhost:8000/health',timeout=2); sys.exit(0 if r.status==200 else 1)"
      interval: 30s
      timeout: 5s
      start_period: 120s
      retries: 3

  web_backend:
    build:
      context: .
      dockerfile: web/backend/Dockerfile
    container_name: web_backend
    env_file:
      - web/backend/.env
    environment:
      RAG_SERVICE_URL: http://rag_service:8000
      RAG_TIMEOUT: "60"
      DATABASE_URL: sqlite:////data/web.db
      WEB_CORS_ORIGINS: http://localhost:5173,http://localhost:8080
      JWT_ALGORITHM: HS256
      JWT_EXPIRE_MINUTES: "10080"
      GUEST_QUERY_LIMIT: "5"
    volumes:
      - web_db:/data
    depends_on:
      rag_service:
        condition: service_healthy
    ports:
      - "8001:8001"

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    container_name: frontend
    ports:
      - "8090:80"
    depends_on:
      - web_backend

volumes:
  hf_cache:
  web_db:
