server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # SPA fallback — let React Router (if added later) handle deep links.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Reverse-proxy /api to the web_backend service on the docker network.
    # Same-origin, so the SPA can use VITE_API_BASE="" and no CORS is needed.
    location /api/ {
        proxy_pass http://web_backend:8001/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }
}
